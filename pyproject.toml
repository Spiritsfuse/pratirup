[project]
name = "pratirup"
version = "0.1.0"
description = "Pratirup: a glucose digital twin for type 2 diabetes care teams (research prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Team Aflatoon, Scaler School of Technology" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pratirup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
