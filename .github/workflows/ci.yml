name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests (leakage, labels, live-vs-replay parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install
        run: pip install -r requirements-serve.txt pytest==9.1.1 matplotlib==3.11.2
      - name: Test
        run: pytest -q
      - name: Dependency audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r requirements-serve.txt --progress-spinner off

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (npm, high and critical)
        run: npm audit --audit-level=high --omit=dev

  docker:
    name: Docker image build, smoke test and scan
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t pratirup:ci .
      - name: Smoke test
        run: |
          docker run -d --name pratirup -p 8000:8000 --read-only --tmpfs /app/var:uid=10001,gid=10001 \
            --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges pratirup:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs "http://127.0.0.1:8000/api/worklist?t=3330" | python3 -c "import sys, json; assert len(json.load(sys.stdin)['patients']) == 20"
          curl -fs -o /dev/null http://127.0.0.1:8000/
          docker logs pratirup | tail -20
      - name: Vulnerability scan (Trivy, report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 pratirup:ci
